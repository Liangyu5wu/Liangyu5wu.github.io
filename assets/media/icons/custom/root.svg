<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 黑色圆形背景 -->
  <circle cx="100" cy="100" r="95" fill="black"/>
  
  <!-- 白色根号符号，增加了水平横线部分 -->
  <path d="M50,130 L70,90 L100,160 L150,40 L150,60" 
        stroke="white" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- 添加根号上方的水平横线 -->
  <line x1="100" y1="60" x2="150" y2="60" 
        stroke="white" 
        stroke-width="8" 
        stroke-linecap="round"/>
</svg>
